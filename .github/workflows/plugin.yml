name: Build WordPress plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - name: PHP syntax
        run: find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: WordPress coding standards (security sniffs)
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --quiet wp-coding-standards/wpcs:"^3.0"
          "$(composer global config bin-dir --absolute --quiet)/phpcs" --standard=WordPress --extensions=php wordpress/jat-arcade-archives
      - name: Package
        run: npm ci && npm run build:plugin
      - uses: actions/upload-artifact@v4
        with:
          name: jat-arcade-archives
          path: dist/jat-arcade-archives.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jat-arcade-archives.zip
